<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockCraft — Mini mundo</title>
<style>
:root{--panel:rgba(18,25,31,.92);--line:#52616b;--accent:#72d14b}*{box-sizing:border-box}body{margin:0;background:#101820;color:#f4f7f8;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}#game-wrap{position:relative;width:100vw;height:100vh;min-height:420px}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}.topbar{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}.panel{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px 13px;box-shadow:0 4px 0 #0003}.logo{font-weight:900;letter-spacing:1px;font-size:17px;text-shadow:2px 2px #000}.logo span{color:var(--accent)}.stats{font-size:12px;color:#d0d9de;margin-top:3px}.help{max-width:290px;font-size:12px;line-height:1.55}.help b{color:#a7ef86}.bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:min(95vw,600px);pointer-events:none}#hotbar{display:flex;gap:5px;padding:7px;background:#0e1217e6;border:2px solid #64737b;border-radius:7px;pointer-events:auto}.slot{width:48px;height:48px;border:2px solid #59656c;background:#29343b;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;border-radius:3px}.slot.selected{border:3px solid white;transform:translateY(-4px);box-shadow:0 0 0 2px #222}.swatch{width:23px;height:23px;border:2px solid #0004;image-rendering:pixelated}.num{position:absolute;top:1px;left:4px;color:#d8e0e4;font-size:10px}.label{font-size:9px;margin-top:2px;color:#e8eef0}.hint{font-size:12px;text-shadow:1px 2px #000;color:#fff;background:#0007;padding:5px 9px;border-radius:5px}#toast{position:absolute;top:95px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #64737b;border-radius:6px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px}#toast.show{opacity:1}.mobile-controls{display:none;position:absolute;bottom:90px;left:12px;right:12px;justify-content:space-between;pointer-events:none}.mobile-controls button{pointer-events:auto;border:2px solid #718087;background:#0f171ccc;color:white;border-radius:9px;width:52px;height:48px;font-size:20px}.mobile-controls .cluster{display:grid;grid-template-columns:repeat(3,52px);gap:5px}@media(max-width:700px){.help{display:none}.slot{width:40px;height:43px}.mobile-controls{display:flex}.bottom{bottom:10px}.hint{font-size:10px}}
</style>
</head>
<body>
<div id="game-wrap"><canvas id="game"></canvas>
<div class="topbar"><div class="panel"><div class="logo">⛏ <span>BLOCK</span>CRAFT</div><div class="stats" id="stats">Mundo nuevo · Día 1</div></div><div class="panel help"><b>WASD / Flechas</b> moverse · <b>Clic izquierdo</b> minar · <b>Clic derecho</b> colocar<br><b>1–6</b> elegir bloque · <b>R</b> mundo nuevo<br>Tip: junta madera y construye algo épico.</div></div>
<div id="toast"></div><div class="mobile-controls"><div class="cluster"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div style="display:flex;gap:6px;align-items:flex-end"><button id="mineBtn">⛏</button><button id="placeBtn">▧</button></div></div>
<div class="bottom"><div class="hint">Explora el mundo y prueba a romper algunos bloques.</div><div id="hotbar"></div></div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hotbar=document.getElementById('hotbar'),toastEl=document.getElementById('toast');const TILE=32,W=100,H=70,blocks=[{id:1,name:'Pasto',color:'#6caf3d',top:'#83c94b'},{id:2,name:'Tierra',color:'#8b5a35',top:'#a36b42'},{id:3,name:'Piedra',color:'#858d91',top:'#a4aaad'},{id:4,name:'Madera',color:'#93602f',top:'#b78248'},{id:5,name:'Hojas',color:'#347b36',top:'#4d9d42'},{id:6,name:'Arena',color:'#d9c27d',top:'#f0dc99'}];let world=[],player,selected=0,camera={x:0,y:0},mouse={x:0,y:0},keys={},inventory=[0,8,0,0,0,0];function resize(){canvas.width=Math.floor(innerWidth*devicePixelRatio);canvas.height=Math.floor(innerHeight*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function rand(seed){let x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}function say(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>toastEl.classList.remove('show'),1700)}function updateHotbar(){hotbar.innerHTML='';blocks.forEach((b,i)=>{const el=document.createElement('div');el.className='slot'+(i===selected?' selected':'');el.title=`${i+1}: ${b.name}`;el.innerHTML=`<span class="num">${i+1}</span><div class="swatch" style="background:linear-gradient(135deg,${b.top} 0 35%,${b.color} 36% 100%)"></div><div class="label">${b.name}</div>`;el.addEventListener('click',()=>{selected=i;updateHotbar()});hotbar.appendChild(el)})}function newWorld(){world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>{const n=rand(x*31+y*97),ridge=Math.sin(x*.17)*2+Math.sin(x*.051)*3,surface=Math.floor(23+ridge);if(y<surface)return 0;if(y===surface)return n<.04?6:1;if(y<surface+4)return 2;return n<.12?3:2}));for(let x=4;x<W-4;x++){let y=0;while(y<H&&world[y][x]===0)y++;if(y>2&&y<H-6&&rand(x*19)>.83){for(let k=1;k<=3;k++)world[y-k][x]=4;for(let dy=-5;dy<=-2;dy++)for(let dx=-2;dx<=2;dx++)if(Math.abs(dx)+Math.abs(dy+3)<5&&y+dy>=0)world[y+dy][x+dx]=5}}player={x:10*TILE,y:18*TILE,w:19,h:27,vx:0,vy:0,onGround:false};inventory=[0,8,0,0,0,0];selected=0;updateHotbar();say('¡Mundo generado! A explorar.')}function getBlock(tx,ty){if(tx<0||tx>=W||ty<0||ty>=H)return 3;return world[ty][tx]}function setBlock(tx,ty,id){if(tx>=0&&tx<W&&ty>=0&&ty<H)world[ty][tx]=id}function collides(x,y){const l=Math.floor(x/TILE),r=Math.floor((x+player.w-1)/TILE),t=Math.floor(y/TILE),b=Math.floor((y+player.h-1)/TILE);for(let ty=t;ty<=b;ty++)for(let tx=l;tx<=r;tx++)if(getBlock(tx,ty)!==0)return true;return false}function update(){const left=keys.ArrowLeft||keys.a||keys.A,right=keys.ArrowRight||keys.d||keys.D;player.vx=(right?2.7:0)-(left?2.7:0);if((keys.ArrowUp||keys.w||keys.W||keys[' '])&&player.onGround){player.vy=-8.2;player.onGround=false}player.vy=Math.min(10,player.vy+.38);player.x+=player.vx;if(collides(player.x,player.y))player.x-=player.vx;player.y+=player.vy;if(collides(player.x,player.y)){player.y-=player.vy;if(player.vy>0)player.onGround=true;player.vy=0}else player.onGround=false;player.x=Math.max(0,Math.min(W*TILE-player.w,player.x));camera.x=Math.max(0,Math.min(W*TILE-innerWidth,player.x+player.w/2-innerWidth/2));camera.y=Math.max(0,Math.min(H*TILE-innerHeight,player.y-innerHeight*.55));document.getElementById('stats').textContent=`Bloques en mochila: ${inventory.reduce((a,b)=>a+b,0)} · Día 1`}function drawBlock(x,y,id){const b=blocks[id-1];if(!b)return;const sx=x-camera.x,sy=y-camera.y;ctx.fillStyle=b.color;ctx.fillRect(sx,sy,TILE,TILE);ctx.fillStyle=b.top;ctx.fillRect(sx,sy,TILE,7);ctx.fillStyle='#00000014';for(let i=0;i<4;i++){const px=sx+rand(x/TILE*13+i)*26+3,py=sy+rand(y/TILE*7+i)*20+8;ctx.fillRect(px,py,3,3)}ctx.strokeStyle='#00000014';ctx.strokeRect(sx,sy,TILE,TILE);if(id===4){ctx.strokeStyle='#59391f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx+10,sy+8);ctx.lineTo(sx+10,sy+29);ctx.moveTo(sx+22,sy+8);ctx.lineTo(sx+22,sy+29);ctx.stroke()}if(id===5){ctx.fillStyle='#96dc5f40';ctx.fillRect(sx+5,sy+9,8,7);ctx.fillRect(sx+20,sy+18,7,6)}}function render(){const sky=ctx.createLinearGradient(0,0,0,innerHeight);sky.addColorStop(0,'#70c5f2');sky.addColorStop(.72,'#c9efff');sky.addColorStop(1,'#f1fbff');ctx.fillStyle=sky;ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#92d6a0';ctx.beginPath();ctx.moveTo(0,innerHeight);for(let x=0;x<=innerWidth+20;x+=20)ctx.lineTo(x,innerHeight*.55+Math.sin((x+camera.x*.15)*.008)*32);ctx.lineTo(innerWidth,innerHeight);ctx.fill();const x0=Math.max(0,Math.floor(camera.x/TILE)),x1=Math.min(W,Math.ceil((camera.x+innerWidth)/TILE)),y0=Math.max(0,Math.floor(camera.y/TILE)),y1=Math.min(H,Math.ceil((camera.y+innerHeight)/TILE));for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const id=world[y][x];if(id)drawBlock(x*TILE,y*TILE,id)}const px=player.x-camera.x,py=player.y-camera.y;ctx.fillStyle='#0003';ctx.fillRect(px-3,py+player.h-2,player.w+6,5);ctx.fillStyle='#e8b58a';ctx.fillRect(px+4,py,12,11);ctx.fillStyle='#583c2b';ctx.fillRect(px+3,py,14,4);ctx.fillRect(px+2,py+3,4,4);ctx.fillStyle='#3c6fbb';ctx.fillRect(px+2,py+11,15,9);ctx.fillStyle='#294b82';ctx.fillRect(px+2,py+19,6,8);ctx.fillRect(px+11,py+19,6,8);ctx.fillStyle='#26323a';ctx.fillRect(px+5,py+4,2,2);ctx.fillRect(px+12,py+4,2,2);const tx=Math.floor((mouse.x+camera.x)/TILE),ty=Math.floor((mouse.y+camera.y)/TILE);if(tx>=0&&tx<W&&ty>=0&&ty<H){ctx.strokeStyle='white';ctx.lineWidth=2;ctx.strokeRect(tx*TILE-camera.x+1,ty*TILE-camera.y+1,TILE-2,TILE-2)}requestAnimationFrame(render)}function target(){return{x:Math.floor((mouse.x+camera.x)/TILE),y:Math.floor((mouse.y+camera.y)/TILE)}}function inReach(tx,ty){return Math.hypot(tx*TILE+TILE/2-(player.x+player.w/2),ty*TILE+TILE/2-(player.y+player.h/2))<TILE*5}function mine(){const{x,y}=target();if(!inReach(x,y)){say('Está demasiado lejos.');return}const id=getBlock(x,y);if(id){setBlock(x,y,0);inventory[id-1]++;updateHotbar();say(`${blocks[id-1].name} minado +1`)}}function place(){const{x,y}=target();if(!inReach(x,y)){say('Está demasiado lejos.');return}if(getBlock(x,y)!==0){say('Ese espacio está ocupado.');return}if(inventory[selected]===0){say('No tienes ese bloque. ¡Mina algunos!');return}if(x*TILE<player.x+player.w&&x*TILE+TILE>player.x&&y*TILE<player.y+player.h&&y*TILE+TILE>player.y){say('No puedes colocarlo dentro de ti.');return}setBlock(x,y,blocks[selected].id);inventory[selected]--;updateHotbar()}canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});canvas.addEventListener('mousedown',e=>{if(e.button===0)mine();if(e.button===2)place()});canvas.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key>='1'&&e.key<='6'){selected=Number(e.key)-1;updateHotbar()}if(e.key.toLowerCase()==='r')newWorld()});addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>keys[k]=false))});document.getElementById('mineBtn').addEventListener('click',mine);document.getElementById('placeBtn').addEventListener('click',place);newWorld();updateHotbar();setInterval(update,1000/60);render()})();
</script>
</body>
</html>
